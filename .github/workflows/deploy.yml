name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rotorbench/package-lock.json

      - name: Install Dependencies
        working-directory: rotorbench
        run: npm ci

      - name: Build
        working-directory: rotorbench
        env:
          CI: false
          GENERATE_SOURCEMAP: false
          PUBLIC_URL: /RotorBench
          # Team default API host for GitHub Pages deployments.
          REACT_APP_API_BASE: https://rotor.nori.fish
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./rotorbench/build
